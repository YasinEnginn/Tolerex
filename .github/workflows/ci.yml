name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1 -cover
      - name: Race detector
        run: go test -race ./... -count=1
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Validate Compose files
        env:
          GRAFANA_ADMIN_PASSWORD: ci-only
        run: |
          go run ./cmd/certgen
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.cluster.yml config --quiet
