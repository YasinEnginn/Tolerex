services:
  # ========================================
  # LEADER NODE
  # ========================================
  leader:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tolerex-node:latest
    command: ["./leader"]
    restart: unless-stopped
    environment:
      - LEADER_GRPC_PORT=5555
      - LEADER_TCP_PORT=6666
      - LEADER_TCP_BIND=0.0.0.0
      - LEADER_METRICS_PORT=9090
      - TOLEREX_ENV=docker
    ports:
      - "6666:6666" # Client TCP Interface
      - "5555:5555" # gRPC
      - "9090:9090" # Metrics
    networks:
      - tolerex-net
    volumes:
      - leader-data:/app/internal/data

  # ========================================
  # MEMBER NODES
  # ========================================
  member-1:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tolerex-node:latest
    command: ["./member", "-port=5556", "-metrics=9092", "-io=buffered"]
    restart: unless-stopped
    environment:
      - LEADER_ADDR=leader:5555
      - MEMBER_ADDR=member-1:5556
    ports:
      - "5556:5556"
      - "9092:9092"
    depends_on:
      - leader
    networks:
      - tolerex-net
    volumes:
      - member1-data:/app/internal/data

  member-2:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tolerex-node:latest
    command: ["./member", "-port=5557", "-metrics=9093", "-io=buffered"]
    restart: unless-stopped
    environment:
      - LEADER_ADDR=leader:5555
      - MEMBER_ADDR=member-2:5557
    ports:
      - "5557:5557"
      - "9093:9093"
    depends_on:
      - leader
    networks:
      - tolerex-net
    volumes:
      - member2-data:/app/internal/data

  member-3:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tolerex-node:latest
    command: ["./member", "-port=5558", "-metrics=9094", "-io=buffered"]
    restart: unless-stopped
    environment:
      - LEADER_ADDR=leader:5555
      - MEMBER_ADDR=member-3:5558
    ports:
      - "5558:5558"
      - "9094:9094"
    depends_on:
      - leader
    networks:
      - tolerex-net
    volumes:
      - member3-data:/app/internal/data

  member-4:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tolerex-node:latest
    command: ["./member", "-port=5559", "-metrics=9095", "-io=buffered"]
    restart: unless-stopped
    environment:
      - LEADER_ADDR=leader:5555
      - MEMBER_ADDR=member-4:5559
    ports:
      - "5559:5559"
      - "9095:9095"
    depends_on:
      - leader
    networks:
      - tolerex-net
    volumes:
      - member4-data:/app/internal/data

  member-5:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tolerex-node:latest
    command: ["./member", "-port=5560", "-metrics=9096", "-io=buffered"]
    restart: unless-stopped
    environment:
      - LEADER_ADDR=leader:5555
      - MEMBER_ADDR=member-5:5560
    ports:
      - "5560:5560"
      - "9096:9096"
    depends_on:
      - leader
    networks:
      - tolerex-net
    volumes:
      - member5-data:/app/internal/data

  member-6:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tolerex-node:latest
    command: ["./member", "-port=5561", "-metrics=9097", "-io=buffered"]
    restart: unless-stopped
    environment:
      - LEADER_ADDR=leader:5555
      - MEMBER_ADDR=member-6:5561
    ports:
      - "5561:5561"
      - "9097:9097"
    depends_on:
      - leader
    networks:
      - tolerex-net
    volumes:
      - member6-data:/app/internal/data
      
  # ========================================
  # MONITORING STACK
  # ========================================
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.cluster.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9091:9090"
    networks:
      - tolerex-net

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_DEFAULT_THEME=dark
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - tolerex-net
    depends_on:
      - prometheus

networks:
  tolerex-net:
    driver: bridge

volumes:
  leader-data:
  member1-data:
  member2-data:
  member3-data:
  member4-data:
  member5-data:
  member6-data:
  grafana-data:
