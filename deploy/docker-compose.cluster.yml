name: tolerex-cluster

services:
  leader:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tolerex-node:latest
    command: ["./leader"]
    restart: unless-stopped
    environment:
      - LEADER_GRPC_PORT=5555
      - LEADER_TCP_PORT=6666
      - LEADER_TCP_BIND=0.0.0.0
      - LEADER_METRICS_PORT=9090
      - LEADER_CERT_FILE=/run/secrets/leader_crt
      - LEADER_KEY_FILE=/run/secrets/leader_key
      - CA_CERT_FILE=/run/secrets/ca_crt
      - TOLEREX_LOG_FILE=off
    ports:
      - "6666:6666"
      - "5555:5555"
      - "9090:9090"
    networks:
      - tolerex-net
    volumes:
      - leader-data:/app/internal/data
    secrets:
      - ca_crt
      - leader_crt
      - leader_key

  member-1:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tolerex-node:latest
    command: ["./member", "-port=5556", "-metrics=9092", "-io=buffered"]
    restart: unless-stopped
    environment:
      - LEADER_ADDR=leader:5555
      - MEMBER_ADDR=member-1:5556
      - MEMBER_CERT_FILE=/run/secrets/member_crt
      - MEMBER_KEY_FILE=/run/secrets/member_key
      - CA_CERT_FILE=/run/secrets/ca_crt
      - TOLEREX_LOG_FILE=off
    depends_on:
      - leader
    networks:
      - tolerex-net
    volumes:
      - member1-data:/app/internal/data
    secrets: [ca_crt, member_crt, member_key]

  member-2:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tolerex-node:latest
    command: ["./member", "-port=5557", "-metrics=9093", "-io=buffered"]
    restart: unless-stopped
    environment:
      - LEADER_ADDR=leader:5555
      - MEMBER_ADDR=member-2:5557
      - MEMBER_CERT_FILE=/run/secrets/member_crt
      - MEMBER_KEY_FILE=/run/secrets/member_key
      - CA_CERT_FILE=/run/secrets/ca_crt
      - TOLEREX_LOG_FILE=off
    depends_on:
      - leader
    networks:
      - tolerex-net
    volumes:
      - member2-data:/app/internal/data
    secrets: [ca_crt, member_crt, member_key]

  member-3:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tolerex-node:latest
    command: ["./member", "-port=5558", "-metrics=9094", "-io=buffered"]
    restart: unless-stopped
    environment:
      - LEADER_ADDR=leader:5555
      - MEMBER_ADDR=member-3:5558
      - MEMBER_CERT_FILE=/run/secrets/member_crt
      - MEMBER_KEY_FILE=/run/secrets/member_key
      - CA_CERT_FILE=/run/secrets/ca_crt
      - TOLEREX_LOG_FILE=off
    depends_on:
      - leader
    networks:
      - tolerex-net
    volumes:
      - member3-data:/app/internal/data
    secrets: [ca_crt, member_crt, member_key]

  member-4:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tolerex-node:latest
    command: ["./member", "-port=5559", "-metrics=9095", "-io=buffered"]
    restart: unless-stopped
    environment:
      - LEADER_ADDR=leader:5555
      - MEMBER_ADDR=member-4:5559
      - MEMBER_CERT_FILE=/run/secrets/member_crt
      - MEMBER_KEY_FILE=/run/secrets/member_key
      - CA_CERT_FILE=/run/secrets/ca_crt
      - TOLEREX_LOG_FILE=off
    depends_on:
      - leader
    networks:
      - tolerex-net
    volumes:
      - member4-data:/app/internal/data
    secrets: [ca_crt, member_crt, member_key]

  member-5:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tolerex-node:latest
    command: ["./member", "-port=5560", "-metrics=9096", "-io=buffered"]
    restart: unless-stopped
    environment:
      - LEADER_ADDR=leader:5555
      - MEMBER_ADDR=member-5:5560
      - MEMBER_CERT_FILE=/run/secrets/member_crt
      - MEMBER_KEY_FILE=/run/secrets/member_key
      - CA_CERT_FILE=/run/secrets/ca_crt
      - TOLEREX_LOG_FILE=off
    depends_on:
      - leader
    networks:
      - tolerex-net
    volumes:
      - member5-data:/app/internal/data
    secrets: [ca_crt, member_crt, member_key]

  member-6:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tolerex-node:latest
    command: ["./member", "-port=5561", "-metrics=9097", "-io=buffered"]
    restart: unless-stopped
    environment:
      - LEADER_ADDR=leader:5555
      - MEMBER_ADDR=member-6:5561
      - MEMBER_CERT_FILE=/run/secrets/member_crt
      - MEMBER_KEY_FILE=/run/secrets/member_key
      - CA_CERT_FILE=/run/secrets/ca_crt
      - TOLEREX_LOG_FILE=off
    depends_on:
      - leader
    networks:
      - tolerex-net
    volumes:
      - member6-data:/app/internal/data
    secrets: [ca_crt, member_crt, member_key]

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    volumes:
      - ./prometheus.cluster.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9091:9090"
    networks:
      - tolerex-net

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_DEFAULT_THEME=dark
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - tolerex-net
    depends_on:
      - prometheus

networks:
  tolerex-net:
    driver: bridge

secrets:
  ca_crt:
    file: ../config/tls/ca.crt
  leader_crt:
    file: ../config/tls/leader.crt
  leader_key:
    file: ../config/tls/leader.key
  member_crt:
    file: ../config/tls/member.crt
  member_key:
    file: ../config/tls/member.key

volumes:
  leader-data:
  member1-data:
  member2-data:
  member3-data:
  member4-data:
  member5-data:
  member6-data:
  grafana-data:
