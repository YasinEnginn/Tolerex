global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: tolerex-leader-cluster
    metrics_path: /metrics
    static_configs:
      - targets:
          - leader:9090

  - job_name: tolerex-members-cluster
    metrics_path: /metrics
    static_configs:
      - targets:
          - member-1:9092
          - member-2:9093
          - member-3:9094
